<rect x="58" y="36" width="1084" height="64" rx="18" fill="#18223a" stroke="#34415c"/><rect x="82" y="54" width="30" height="30" rx="9" fill="url(#accent)"/><path d="M97 58v16m-7-7 7 7 7-7" stroke="#10182a" stroke-width="3" fill="none" stroke-linecap="round"/><text x="126" y="76" fill="#f4f6ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">BELTAH <tspan fill="#a99aff">DOWNLOADER</tspan></text><rect x="920" y="53" width="166" height="32" rx="16" fill="#25324b"/><text x="1003" y="74" text-anchor="middle" fill="#e9edff" font-family="Arial,sans-serif" font-size="12">↓ Install Downloader</text>
<text x="600" y="166" text-anchor="middle" fill="#a99aff" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">✦ MULTI-PLATFORM DOWNLOAD WORKSPACE</text><text x="600" y="238" text-anchor="middle" fill="#f5f7ff" font-family="Arial,sans-serif" font-size="55" font-weight="700">Save what matters.</text><text x="600" y="300" text-anchor="middle" fill="url(#accent)" font-family="Arial,sans-serif" font-size="55" font-weight="700">Keep it moving.</text><text x="600" y="340" text-anchor="middle" fill="#9ba8c2" font-family="Arial,sans-serif" font-size="17">A simple workspace for direct media and file links.</text>
