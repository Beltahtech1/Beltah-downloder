<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">BELTAH DOWNLOADER interface preview</title><desc id="desc">Illustrated dark downloader interface with brand, link field, format selector, queue and recent activity.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset="1" stop-color="#14233b"/></linearGradient><linearGradient id="accent"><stop stop-color="#a69aff"/><stop offset="1" stop-color="#64d9dc"/></linearGradient></defs>
